[package]
name = "nono"
version = "0.73.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Capability-based sandboxing library using Landlock (Linux) and Seatbelt (macOS)"
readme = "README.md"
keywords = ["sandbox", "security", "capability", "landlock", "seatbelt"]
categories = ["os", "api-bindings"]

[features]
default = ["system-keyring", "sigstore-trust"]
# Enables OS system keyring access (macOS Keychain / Linux Secret Service).
# Headless/container consumers opt out with default-features = false.
system-keyring = ["dep:keyring"]
# Enables Sigstore bundle verification and keyed signing (`trust::bundle`,
# `trust::signing`, and the audit attestation bundle functions in `audit`).
# On by default so existing consumers are unaffected. Consumers that only need
# the sandbox lifecycle opt out with default-features = false: the sigstore
# graph drags in reqwest/rustls/aws-lc-sys (a C build script that blocks
# cross-compilation) plus MPL-2.0 and CDLA-licensed transitive crates that
# stricter `cargo deny` license policies reject. The lifecycle module itself
# has never touched sigstore.
sigstore-trust = [
    "dep:sigstore-verify",
    "dep:sigstore-trust-root",
    "dep:x509-cert",
    "dep:der",
]

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# "derive" carries the #[derive(Zeroize, ZeroizeOnDrop)] on lifecycle::gate's
# activation token. It is declared here rather than left to feature
# unification: before sigstore became optional the derive feature arrived only
# by accident through the sigstore dependency graph, so a default-features =
# false build of this crate stopped compiling without it.
zeroize = { workspace = true, features = ["derive"] }
sha2.workspace = true
getrandom.workspace = true
uuid.workspace = true
walkdir.workspace = true
ignore.workspace = true
globset.workspace = true
regress = "0.11"

# Unix socket IPC for supervisor
libc = "0.2"

# Keychain access (optional). On Linux the Secret Service is reached via the
# pure-Rust zbus backend (see the linux target deps below), so the default
# build has no libdbus runtime dependency. default-features = false is set on
# every keyring declaration so only the explicitly-listed backend is ever
# compiled — guarding against a future keyring release adding a libdbus
# backend to its defaults.
keyring = { version = "3", optional = true, default-features = false }

# Sigstore bundle verification (optional, behind the default-on
# `sigstore-trust` feature — see [features] above).
# `sigstore-trust-root` is pinned to 0.6.3 because 0.6.5 made
# `TufSigningConfig::production()` async without bumping major,
# breaking sigstore-sign 0.6.3 (which the sigstore-verify graph pulls
# transitively even though we don't use it directly). We don't depend
# on sigstore-sign or sigstore-trust-root in our own code; this pin
# exists purely to keep the resolver on a coherent 0.6.3-era set
# until the upstream API churn settles.
sigstore-verify = { version = "0.11.0", default-features = false, optional = true }
sigstore-trust-root = { version = "=0.11.0", optional = true }
# Only used by trust::bundle to decode Fulcio certificate extensions, so these
# ride along with the sigstore feature rather than being unconditional.
x509-cert = { version = "0.3", default-features = false, optional = true }
der = { version = "0.8", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
# "process" and "signal" carry the lifecycle module's fork/waitpid/kill path;
# "dir" and "fs" carry the durable session store's openat/renameat/readdir path.
nix = { workspace = true, features = ["dir", "fs", "process", "signal", "user"] }
# Pure-Rust Secret Service backend (zbus over the D-Bus socket) so the binary
# does not link libdbus and starts on hosts without it. crypto-rust keeps
# session encryption pure-Rust; async-io is the runtime (avoids a tokio
# block_on-within-runtime panic since a tokio runtime is already active).
keyring = { version = "3", features = ["async-secret-service", "crypto-rust", "async-io"], optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# "process" and "signal" carry the lifecycle module's fork/waitpid/kill path;
# "dir" and "fs" carry the durable session store's openat/renameat/readdir path.
nix = { workspace = true, features = ["dir", "fs", "process", "signal", "user"] }
keyring = { version = "3", features = ["apple-native"], optional = true, default-features = false }

[build-dependencies]
typify = "0.7"
serde_json.workspace = true
syn = "3"
prettyplease = "0.3"

[dev-dependencies]
tempfile.workspace = true
jsonschema = "0.48"

# Deterministic concurrency harness for lifecycle/sync_core.rs. Wired as the
# loom README prescribes — a cfg-gated normal dependency, not a dev-dependency,
# because the shared core itself swaps its lock for loom's under that cfg — but
# under our own cfg name rather than the README's bare `loom`. RUSTFLAGS reach
# every crate in the build, and `--cfg loom` makes tokio compile out
# `tokio::net`, which hyper-util (pulled in transitively by sigstore-verify)
# then fails to find. `nono_loom` says the same thing to our code and nothing
# to anyone else's. No ordinary build ever resolves this. Run with:
#   RUSTFLAGS='--cfg nono_loom' cargo test -p nono --test loom_lifecycle --release
[target.'cfg(nono_loom)'.dependencies]
loom = "0.7"

# The detached-supervisor live tests. `harness = false` because these tests can
# only run in a binary that installs the entry hook: a detached prepare
# re-executes `current_exe()` and expects it to become a supervisor, which it
# does only if `nono::lifecycle::supervisor_entry()` is called at the top of
# `main`. libtest owns `main` and offers no pre-main hook, so this target brings
# its own — which is also what makes the true caller-death test possible, since
# the same binary can re-run itself as a launcher that exits.
[[test]]
name = "lifecycle_detached"
harness = false

[lints]
workspace = true
